name: Release

# リリース準備 PR（prepare-release.yml が作る `chore(release): vX.Y.Z`）を squash マージすると動く。
# release-automate が draft の Release とタグを作り、続けて次の順に進む。
#   draft → CLI と MSIX のビルド → WACK → 成果物の添付 → Release から再取得して照合 → Release の公開
#   → Store への提出（Environment `store-production`）
# リリース準備 PR 以外の main への push では、draft ジョブが skip され、後続のジョブも動かない。
#
# release-automate のタグは GITHUB_TOKEN で作られ、`push: tags` の別のワークフローを起動しない。
# そのため成果物のビルドは、タグの push ではなく、この workflow の job として行う。
#
# MSIX の manifest Version は、コミットされた値ではなく、タグから作業コピーへ注入する
# （prepare は Directory.Build.props の Version だけを更新し、manifest は更新しないため）。
#
# 失敗したときは、同じ実行で「Re-run failed jobs」を使う（新しいタグを切らない）。Release の公開の後に
# Store の提出だけが失敗した場合も同じで、公開済みの Release は変更しない。
# 手順と運用は docs/msix-packaging-and-store-guide.md の 6.1 と 8.4。

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      draft: true

  cli:
    name: CLI (${{ matrix.rid }})
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ${{ matrix.os }}
    env:
      LEFTHOOK: 0
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive_ext: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive_ext: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive_ext: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: バージョン文字列を抽出（v プレフィックス除去）
        id: version
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 依存関係の復元（RID 付き）
        # self-contained publish に必要な runtime pack を正しく復元するため
        # --runtime と SelfContained プロパティを restore 側にも指定する
        run: >
          dotnet restore src/CloudMigrator.Cli/CloudMigrator.Cli.csproj
          --runtime ${{ matrix.rid }}
          -p:SelfContained=true
          -p:PublishSingleFile=true

      - name: Self-contained 単一ファイルとして発行
        run: >
          dotnet publish src/CloudMigrator.Cli/CloudMigrator.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --no-restore
          --output publish/${{ matrix.rid }}

      - name: Dashboard を発行（win-x64 専用）
        if: matrix.rid == 'win-x64'
        run: >
          dotnet publish src/CloudMigrator.Dashboard/CloudMigrator.Dashboard.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: アーカイブ作成（Windows）
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          $assetName = "cloud-migrator-${env:TAG}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $assetName

      - name: アーカイブ作成（Unix）
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          asset_name="cloud-migrator-${TAG}-${{ matrix.rid }}.tar.gz"
          tar -czf "${asset_name}" -C "publish/${{ matrix.rid }}" .

      - name: アーカイブを artifact に保存
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: cloud-migrator-${{ needs.draft.outputs.tag_name }}-${{ matrix.rid }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  msix:
    name: MSIX パッケージビルド
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: windows-latest
    env:
      LEFTHOOK: 0
    permissions:
      contents: read

    steps:
      - name: リポジトリを checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - name: .NET SDK セットアップ
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # コミットされた manifest の Version は開発用の値。リリースのビルドでは、作業コピーの
      # installer/msix/Package.appxmanifest の Identity Version を、タグから注入した値にする。
      - name: タグから manifest Version を設定
        id: version
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          if ($env:TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "無効なリリースタグ形式です。SemVer 形式のタグを使用してください: $env:TAG"
          }
          $manifestVersion = "$($Matches['version']).0"

          $path = Join-Path $env:GITHUB_WORKSPACE 'installer/msix/Package.appxmanifest'
          $content = [IO.File]::ReadAllText($path)
          $pattern = '(?s)(<Identity\b[^>]*?\sVersion=")[^"]*(")'
          if ([regex]::Matches($content, $pattern).Count -ne 1) {
            throw "Package.appxmanifest の Identity Version を 1 か所に特定できません。"
          }
          $updated = [regex]::Replace($content, $pattern, "`${1}$manifestVersion`${2}")
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))

          [xml]$manifest = Get-Content -LiteralPath $path -Raw
          if ($manifest.Package.Identity.Version -ne $manifestVersion) {
            throw "manifest Version の設定に失敗しました。期待: $manifestVersion、実際: $($manifest.Package.Identity.Version)"
          }
          "version=$manifestVersion" >> $env:GITHUB_OUTPUT

      - name: MSIX を生成
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\installer\msix\Build-MsixPackage.ps1 `
            -Configuration Release `
            -Version "${{ steps.version.outputs.version }}"

      - name: MSIX manifest・アセットを静的検査
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\ValidateMsixPackage.ps1 `
            -PackagePath ".\installer\msix\AppPackages\CloudMigrator_${{ steps.version.outputs.version }}_x64.msix"

      - name: MSIX artifact の SHA-256 証跡を作成
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
          TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
        run: |
          $packageFiles = @(Get-ChildItem -Path "installer/msix/AppPackages/CloudMigrator_*_x64.msix" -File)
          $uploadFiles = @(Get-ChildItem -Path "installer/msix/AppPackages/CloudMigrator_*_x64_bundle.msixupload" -File)
          if ($packageFiles.Count -ne 1 -or $uploadFiles.Count -ne 1) {
            throw "MSIX artifact は .msix と .msixupload を各 1 個だけ含む必要があります。msix=$($packageFiles.Count), msixupload=$($uploadFiles.Count)"
          }

          $package = $packageFiles[0]
          $upload = $uploadFiles[0]
          $evidence = [ordered]@{
            schemaVersion = 1
            tag = $env:TAG
            commit = $env:TARGET_SHA
            version = "${{ steps.version.outputs.version }}"
            packageFile = $package.Name
            packageSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            uploadFile = $upload.Name
            uploadSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $upload.FullName).Hash.ToLowerInvariant()
            createdAtUtc = [DateTime]::UtcNow.ToString('O')
          } | ConvertTo-Json -Depth 5

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'msix-artifact'
          if (Test-Path -LiteralPath $artifactDirectory) {
            Remove-Item -LiteralPath $artifactDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDirectory | Out-Null
          Copy-Item -LiteralPath $package.FullName -Destination $artifactDirectory
          Copy-Item -LiteralPath $upload.FullName -Destination $artifactDirectory
          [IO.File]::WriteAllText(
            (Join-Path $artifactDirectory 'msix-artifact-evidence.json'),
            $evidence,
            [Text.UTF8Encoding]::new($false))
          Write-Host $evidence

      - name: MSIX をアーティファクトに保存
        uses: actions/upload-artifact@v7
        with:
          name: msix-release-${{ github.run_id }}
          path: msix-artifact/*
          if-no-files-found: error
          retention-days: 30

  wack:
    name: WACK（同一 MSIX artifact）
    needs: [draft, msix]
    if: needs.draft.outputs.release_state == 'draft'
    # 呼び出し先の wack.yml が `actions: read` を要求するため、同じ権限を渡す。
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/wack.yml
    with:
      artifact_name: msix-release-${{ github.run_id }}

  # Store へ出すものと同じファイルを、Release にも添付する（成果物の同一性）。
  attach:
    name: Release へ成果物を添付
    needs: [draft, cli, msix]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: CLI のアーカイブを取得
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: artifact

      - name: MSIX を取得
        uses: actions/download-artifact@v8
        with:
          name: msix-release-${{ github.run_id }}
          path: artifact

      - name: draft の Release へ成果物を添付
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifact -type f \( -name 'cloud-migrator-*.zip' -o -name 'cloud-migrator-*.tar.gz' -o -name '*.msix' -o -name '*.msixupload' \))
          # CLI 4 個（win-x64、linux-x64、osx-x64、osx-arm64）+ .msix + .msixupload
          if [[ ${#files[@]} -ne 6 ]]; then
            echo "::error::添付する成果物が 6 つではありません: ${files[*]}"
            exit 1
          fi
          # 再実行で重複しないよう、既存の同名の asset は置き換える。
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: Release の成果物を照合
    needs: [draft, attach]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      # draft の Release は、push 権限のある資格情報でないと取得できない。ここでは読み取りだけを行う。
      contents: write
    steps:
      - name: CLI のアーカイブを取得
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: expected

      - name: MSIX を取得
        uses: actions/download-artifact@v8
        with:
          name: msix-release-${{ github.run_id }}
          path: expected

      - name: Release から成果物を再取得して照合
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir actual
          gh release download "$TAG" --dir actual --repo "$GITHUB_REPOSITORY"

          mapfile -t names < <(find expected -type f \( -name 'cloud-migrator-*.zip' -o -name 'cloud-migrator-*.tar.gz' -o -name '*.msix' -o -name '*.msixupload' \) -printf '%f\n' | sort)
          mapfile -t attached < <(find actual -type f -printf '%f\n' | sort)
          if [[ "${names[*]}" != "${attached[*]}" || ${#names[@]} -ne 6 ]]; then
            echo "::error::Release の asset が、ビルドの成果物と一致しません。期待: ${names[*]}、実際: ${attached[*]}"
            exit 1
          fi

          for name in "${names[@]}"; do
            expected_hash=$(sha256sum "$(find expected -type f -name "$name")" | cut -d' ' -f1)
            actual_hash=$(sha256sum "actual/$name" | cut -d' ' -f1)
            if [[ "$expected_hash" != "$actual_hash" ]]; then
              echo "::error::$name の SHA-256 がビルドの成果物と一致しません"
              exit 1
            fi
          done
          echo "照合しました: ${names[*]}"

  finalize:
    needs: [draft, wack, verify]
    if: needs.draft.outputs.release_state == 'draft'
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}

  # Release の公開の後に、WACK を通した同じ .msixupload を Store の submission として送る。
  store:
    name: Microsoft Store 自動公開
    needs: [draft, finalize]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: windows-latest
    timeout-minutes: 360
    environment:
      name: store-production
      url: https://partner.microsoft.com/dashboard/products/${{ vars.STORE_PRODUCT_ID }}
    concurrency:
      group: store-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: リポジトリを checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - name: MSIX artifact を取得
        uses: actions/download-artifact@v8
        with:
          name: msix-release-${{ github.run_id }}
          path: store-input

      - name: MSIX artifact と証跡を照合
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
          TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'store-input' -File -Filter '*.msix')
          $uploads = @(Get-ChildItem -LiteralPath 'store-input' -File -Filter '*.msixupload')
          $evidencePath = Join-Path $env:GITHUB_WORKSPACE 'store-input/msix-artifact-evidence.json'
          if ($packages.Count -ne 1 -or $uploads.Count -ne 1 -or -not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw "Store 入力 artifact は .msix、.msixupload、証跡 JSON を各 1 個含む必要があります。msix=$($packages.Count), msixupload=$($uploads.Count)"
          }

          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $package = $packages[0]
          $upload = $uploads[0]
          $expectedPackage = "CloudMigrator_$($evidence.version)_x64.msix"
          $expectedUpload = "CloudMigrator_$($evidence.version)_x64_bundle.msixupload"
          if ($evidence.tag -ne $env:TAG -or $evidence.commit -ne $env:TARGET_SHA) {
            throw "MSIX artifact の tag/commit 証跡が現在の release と一致しません。"
          }
          if ($package.Name -ne $expectedPackage -or $upload.Name -ne $expectedUpload) {
            throw "MSIX artifact のファイル名が manifest Version と一致しません。"
          }

          $packageHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          $uploadHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $upload.FullName).Hash.ToLowerInvariant()
          if ($packageHash -ne $evidence.packageSha256 -or $uploadHash -ne $evidence.uploadSha256) {
            throw "MSIX artifact の SHA-256 が生成時の証跡と一致しません。"
          }

          @(
            '### Store 公開 artifact',
            "- tag: $env:TAG",
            "- commit: $env:TARGET_SHA",
            "- package: $($package.Name) ($packageHash)",
            "- upload: $($upload.Name) ($uploadHash)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Microsoft Store Developer CLI をセットアップ
        id: msstore_cli
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Partner Center credentials を設定
        shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $required = @{
            AZURE_AD_APPLICATION_CLIENT_ID = $env:AZURE_AD_APPLICATION_CLIENT_ID
            AZURE_AD_APPLICATION_SECRET = $env:AZURE_AD_APPLICATION_SECRET
            AZURE_AD_TENANT_ID = $env:AZURE_AD_TENANT_ID
            SELLER_ID = $env:SELLER_ID
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "GitHub Environment secret が未設定です: $($entry.Key)"
            }
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET

      - name: CLI telemetry を無効化
        shell: pwsh
        run: msstore settings --enableTelemetry false

      - name: 既存 submission を確認し必要なら再開
        id: submission
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) {
            throw 'GitHub Environment variable STORE_PRODUCT_ID が未設定です。Configure-StorePublishing.ps1 を実行してください。'
          }
          $packages = @(Get-ChildItem -LiteralPath 'store-input' -File -Filter '*.msix')
          if ($packages.Count -ne 1) {
            throw "Store 入力の MSIX は 1 個である必要があります。検出数: $($packages.Count)"
          }
          $expectedPackage = $packages[0].Name
          $jsonPath = Join-Path $env:RUNNER_TEMP "store-submission-$env:GITHUB_RUN_ID.json"
          $errorPath = Join-Path $env:RUNNER_TEMP "store-submission-$env:GITHUB_RUN_ID.err"
          & msstore submission get $env:STORE_PRODUCT_ID 1> $jsonPath 2> $errorPath
          if ($LASTEXITCODE -ne 0) {
            throw "既存 submission の取得に失敗しました。Product ID と Partner Center 権限を確認してください。stderr: $errorPath"
          }

          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/StoreSubmissionJson.psm1') -Force
          $submission = Read-StoreSubmissionMetadata -JsonPath $jsonPath
          $status = [string]$submission.Status
          $packageNames = @($submission.PackageNames)
          $samePackage = $packageNames -contains $expectedPackage
          "既存 submission status: $status" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "既存 submission package 一致: $samePackage" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "listing JSON の不正な escape 補正件数: $($submission.RepairedInvalidEscapeCount)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          'already_published=false' >> $env:GITHUB_OUTPUT
          'polled_existing=false' >> $env:GITHUB_OUTPUT
          if ($status -in @('CommitStarted', 'CommitFailed') -and -not $samePackage) {
            throw "別 Version の submission が残っています。現在の submission を上書きせず停止します。"
          }
          if ($status -eq 'CommitStarted') {
            & msstore submission poll $env:STORE_PRODUCT_ID
            if ($LASTEXITCODE -ne 0) {
              throw '既存 submission の poll に失敗しました。'
            }
            'polled_existing=true' >> $env:GITHUB_OUTPUT
          } elseif ($status -eq 'Published' -and $samePackage) {
            'already_published=true' >> $env:GITHUB_OUTPUT
          }

      - name: .msixupload を Store submission へ送信
        if: steps.submission.outputs.already_published != 'true' && steps.submission.outputs.polled_existing != 'true'
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $upload = Get-ChildItem -LiteralPath 'store-input' -File -Filter '*.msixupload' | Select-Object -First 1
          & msstore publish $upload.FullName --appId $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) {
            throw '.msixupload の Store submission に失敗しました。'
          }

      - name: submission status を最終確認
        if: ${{ always() && steps.msstore_cli.outcome == 'success' }}
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $output = @(& msstore submission status $env:STORE_PRODUCT_ID 2>&1)
          $statusExit = $LASTEXITCODE
          $output |
            Where-Object { ([string]$_) -match '(?i)status' } |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($statusExit -ne 0) {
            throw 'Store submission の最終 status 取得に失敗しました。'
          }
