name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  store-submission-json:
    name: Store submission JSON 解析検証
    runs-on: windows-latest
    env:
      LEFTHOOK: 0

    steps:
      - uses: actions/checkout@v7

      - name: PowerShell 解析テスト
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\Test-StoreSubmissionJson.ps1

  build-test:
    name: Build & Test (${{ matrix.os }} / .NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    env:
      LEFTHOOK: 0   # CI では git フックを実行しない
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        dotnet: ["10.0"]

    steps:
      - uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: 依存関係の復元
        run: dotnet restore CloudMigrator.slnx

      - name: フォーマットチェック
        run: dotnet format CloudMigrator.slnx --verify-no-changes

      - name: ビルド
        run: dotnet build CloudMigrator.slnx --no-restore --configuration Release

      - name: テスト（unit + integration）
        run: |
          dotnet test tests/unit/CloudMigrator.Tests.Unit.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults
          dotnet test tests/integration/CloudMigrator.Tests.Integration.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: カバレッジレポートの解決
        id: coverage
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $coverage) {
            throw "coverage.cobertura.xml not found under TestResults"
          }
          "path=$coverage" >> $env:GITHUB_OUTPUT

      - name: Codecov へカバレッジ送信
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.path }}
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: テスト結果のアップロード
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-dotnet${{ matrix.dotnet }}
          path: |
            "**/TestResults/**/*.trx"
            "**/TestResults/**/coverage.cobertura.xml"

  quality-gate:
    name: Quality Gate
    runs-on: windows-latest
    needs: build-test
    if: github.event_name == 'pull_request'
    env:
      LEFTHOOK: 0

    steps:
      - uses: actions/checkout@v7

      - name: .NET セットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: 依存関係の復元
        run: dotnet restore CloudMigrator.slnx

      - name: ビルド（品質チェック用）
        run: dotnet build CloudMigrator.slnx --no-restore --configuration Release

      - name: カバレッジ付きテスト実行
        run: dotnet test tests/unit/CloudMigrator.Tests.Unit.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory QualityResults --logger "trx;LogFileName=test-results.trx"

      - name: 品質ゲート用カバレッジレポートの解決
        id: quality-coverage
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -Path QualityResults -Recurse -Filter coverage.cobertura.xml |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $coverage) {
            throw "coverage.cobertura.xml not found under QualityResults"
          }
          "path=$coverage" >> $env:GITHUB_OUTPUT

      - name: 品質メトリクスチェック
        run: dotnet run --project src/CloudMigrator.Cli/CloudMigrator.Cli.csproj --configuration Release -- quality-metrics --trx-dir QualityResults --coverage-xml "${{ steps.quality-coverage.outputs.path }}"

      - name: セキュリティスキャン
        run: dotnet run --project src/CloudMigrator.Cli/CloudMigrator.Cli.csproj --configuration Release -- security-scan

  msix-check:
    name: MSIX パッケージ検証
    runs-on: windows-latest
    needs: build-test
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    env:
      LEFTHOOK: 0

    steps:
      - name: リポジトリを checkout
        uses: actions/checkout@v7

      - name: .NET SDK セットアップ
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"

      - name: manifest Version を取得
        id: manifest
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content -LiteralPath "installer/msix/Package.appxmanifest" -Raw
          $version = $manifest.Package.Identity.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package.appxmanifest の Identity Version が空です。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: MSIX を生成
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\installer\msix\Build-MsixPackage.ps1 `
            -Configuration Release `
            -Version "${{ steps.manifest.outputs.version }}"

      - name: MSIX manifest・アセットを静的検査
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\ValidateMsixPackage.ps1 `
            -PackagePath ".\installer\msix\AppPackages\CloudMigrator_${{ steps.manifest.outputs.version }}_x64.msix"

      - name: MSIX 生成物をアーティファクトに保存
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-ci-${{ github.run_id }}
          path: |
            installer/msix/AppPackages/CloudMigrator_*_x64.msix
            installer/msix/AppPackages/CloudMigrator_*_x64_bundle.msixupload
          if-no-files-found: warn
          retention-days: 7
